<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Multi-AI Skill Hub — React 18 App</title>
  
  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone (In-browser JSX Compiler) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500" rel="stylesheet">
  
  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased selection:bg-indigo-500 selection:text-white">

  <!-- React Root Container -->
  <div id="root"></div>

  <!-- React 18 JSX Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // 1. SIDEBAR COMPONENT
    function Sidebar({ activeCategory, onSelectCategory, liveSkills }) {
      const allRepos = [];
      if (liveSkills) {
        Object.values(liveSkills).forEach(cat => {
          if (cat.repos) {
            cat.repos.forEach(r => {
              if (!allRepos.some(e => e.name === r.name)) allRepos.push(r);
            });
          }
        });
      }

      const categories = [
        { id: 'overview', name: '📊 Genel Dashboard', tag: 'Ana Sayfa' },
        { id: 'core', name: '🧠 Çekirdek Davranışlar', tag: '/caveman' },
        { id: 'web', name: '🎨 Web & UI/UX Tasarım', tag: '/ux-ui' },
        { id: 'mobile', name: '📱 Mobil (iOS & Android)', tag: '/mobile' },
        { id: 'game', name: '🎮 Oyun Stüdyosu', tag: '/game' },
        { id: 'security', name: '🔐 Siber Güvenlik', tag: '/security' },
        { id: 'planning', name: '📐 Mimari Planlama', tag: '/planning' },
        { id: 'marketing', name: '📈 Pazarlama & ASO', tag: '/marketing' },
      ];

      return (
        <aside class="w-full lg:w-80 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800/80 p-6 flex flex-col justify-between shrink-0">
          <div>
            <div class="flex items-center gap-3 pb-6 mb-6 border-b border-slate-800/80">
              <span class="text-3xl">⚛️</span>
              <div>
                <h1 class="font-extrabold text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">
                  Multi-AI React App
                </h1>
                <p class="text-xs text-slate-400">React 18 + Node.js REST API</p>
              </div>
            </div>

            {/* Categories Navigation */}
            <div class="mb-6">
              <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-3 px-1">
                📂 React Gezilebilir Kategoriler
              </h3>
              <nav class="space-y-1.5">
                {categories.map(cat => (
                  <button
                    key={cat.id}
                    onClick={() => onSelectCategory(cat.id)}
                    class={`w-full flex items-center justify-between px-3 py-2.5 text-xs font-medium rounded-xl transition-all ${
                      activeCategory === cat.id
                        ? 'bg-indigo-600 text-white font-semibold shadow-lg shadow-indigo-600/20'
                        : 'text-slate-300 hover:bg-slate-800/60 hover:text-white'
                    }`}
                  >
                    <span class="flex items-center gap-2">{cat.name}</span>
                    <span class={`text-[10px] ${activeCategory === cat.id ? 'bg-white/20' : 'text-slate-500 font-mono'} px-1.5 py-0.5 rounded`}>
                      {cat.tag}
                    </span>
                  </button>
                ))}
              </nav>
            </div>

            {/* Live Repos List */}
            <div class="mb-6">
              <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-3 px-1 flex justify-between items-center">
                <span>🔗 Canlı Repolar</span>
                <span class="text-[9px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded font-mono">
                  {allRepos.length} Repo
                </span>
              </h3>
              <div class="space-y-1.5 font-mono text-[11px]">
                {allRepos.map(r => (
                  <a
                    key={r.name}
                    href={r.url}
                    target="_blank"
                    class="flex items-center justify-between p-2 rounded-lg bg-slate-950/60 border border-slate-800/60 hover:border-indigo-500/40 text-slate-300 hover:text-indigo-300 transition-all"
                  >
                    <span class="truncate">{r.name}</span>
                    <span class="text-[10px] text-emerald-400 font-mono">{r.tag}</span>
                  </a>
                ))}
              </div>
            </div>
          </div>

          <div class="pt-4 border-t border-slate-800/80 text-[11px] text-slate-500 flex justify-between items-center">
            <span>React 18 Engine</span>
            <a href="https://github.com/imyigo/awesome-ai-agent-skills-manager" target="_blank" class="text-indigo-400 hover:underline">GitHub ⭐</a>
          </div>
        </aside>
      );
    }

    // 2. AI ASSISTANTS CARDS GRID COMPONENT
    function AICardsGrid({ status, onToggleLink }) {
      const aiList = [
        { key: 'antigravity', name: 'Google Antigravity', icon: '🌌', path: '~/.gemini/antigravity' },
        { key: 'claude', name: 'Claude Code', icon: '🤖', path: '~/.claude' },
        { key: 'cursor', name: 'Cursor IDE', icon: '🖱️', path: '~/.cursor' },
        { key: 'codex', name: 'OpenAI Codex', icon: '📜', path: '~/.codex' },
      ];

      return (
        <section class="mb-10">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Bilgisayardaki AI Asistanları & Tercihli Bağlantılar</h3>
            <span class="text-[11px] text-slate-500">React State ile yönetilen canlı bağlantılar.</span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            {aiList.map(ai => {
              const info = status[ai.key] || { installed: false, linked: false };
              return (
                <article key={ai.key} class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-center mb-3">
                      <span class="text-2xl">{ai.icon}</span>
                      <span class={`text-[10px] font-semibold px-2 py-0.5 rounded ${
                        info.installed
                          ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                          : 'bg-slate-800 text-slate-500'
                      }`}>
                        {info.installed ? 'Yüklü' : 'Sistemde Yok'}
                      </span>
                    </div>
                    <h4 class="font-semibold text-sm text-slate-200">{ai.name}</h4>
                    <p class="text-[11px] text-slate-500 mt-1 truncate">{ai.path}</p>
                  </div>
                  <div class="mt-4 pt-3 border-t border-slate-800/60 flex justify-between items-center">
                    <span class={`text-xs font-medium ${info.linked ? 'text-emerald-400' : 'text-slate-500'}`}>
                      {info.linked ? '✅ Bağlı' : '❌ Bağsız'}
                    </span>
                    <button
                      onClick={() => onToggleLink(ai.key)}
                      class={`text-xs px-3 py-1.5 rounded-lg font-semibold transition-all ${
                        info.linked
                          ? 'bg-rose-600/80 hover:bg-rose-500 text-white shadow-lg shadow-rose-600/20'
                          : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/20'
                      }`}
                    >
                      {info.linked ? '🔌 Bağlantıyı Kes' : '🔗 Bağla'}
                    </button>
                  </div>
                </article>
              );
            })}
          </div>
        </section>
      );
    }

    // 3. CATEGORY DETAIL COMPONENT
    function CategoryDetail({ category, onBack }) {
      if (!category) return null;

      return (
        <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-6 shadow-xl space-y-6">
          <div class="flex justify-between items-center pb-4 border-b border-slate-800/60">
            <span class="text-xs font-bold uppercase tracking-wider text-indigo-400">Tetikleyici Slash Komutu</span>
            <code class="bg-slate-950 text-indigo-300 px-3 py-1.5 rounded-lg border border-slate-800 font-mono text-xs font-semibold">{category.command}</code>
          </div>
          
          <p class="text-xs text-slate-300 leading-relaxed">{category.description}</p>
          
          {category.repos && category.repos.length > 0 && (
            <div>
              <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
                <span>🔗</span> İlgili Canlı GitHub Repoları (Node.js REST API)
              </h4>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {category.repos.map(r => (
                  <a key={r.name} href={r.url} target="_blank" class="flex items-center justify-between p-3 rounded-xl bg-slate-950/80 border border-slate-800/80 hover:border-indigo-500/50 transition-all group">
                    <span class="font-mono text-xs text-slate-200 group-hover:text-indigo-300 truncate">{r.name}</span>
                    <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded font-mono">{r.tag}</span>
                  </a>
                ))}
              </div>
            </div>
          )}

          {category.files && category.files.length > 0 && (
            <div>
              <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
                <span>📄</span> İlgili Skill Dosyaları (Node.js Diski)
              </h4>
              <div class="flex flex-wrap gap-2">
                {category.files.map(f => (
                  <span key={f} class="bg-slate-950 text-slate-300 font-mono text-[11px] px-3 py-1.5 rounded-lg border border-slate-800/80 flex items-center gap-1.5">
                    <span class="text-indigo-400">#</span> {f}
                  </span>
                ))}
              </div>
            </div>
          )}

          <div>
            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
              <span>📜</span> Rehber Kuralları & Standartlar
            </h4>
            <ul class="space-y-2.5">
              {category.rules && category.rules.map((rule, idx) => (
                <li key={idx} class="flex items-start gap-2.5 text-xs text-slate-300">
                  <span class="text-emerald-400 font-bold">✓</span>
                  <span>{rule}</span>
                </li>
              ))}
            </ul>
          </div>

          <div class="flex flex-col sm:flex-row gap-3 pt-4 border-t border-slate-800/60">
            <button onClick={onBack} class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2.5 px-4 rounded-xl text-xs transition-all flex items-center justify-center gap-2">
              <span>⬅️ Dashboard'a Dön</span>
            </button>
          </div>
        </div>
      );
    }

    // 4. MAIN REACT APP COMPONENT
    function App() {
      const [activeCategory, setActiveCategory] = useState('overview');
      const [aiStatus, setAiStatus] = useState({});
      const [liveSkills, setLiveSkills] = useState({});
      const [logs, setLogs] = useState(["⚡ React 18 Multi-AI Skill Hub Başlatıldı."]);
      const [newRepoUrl, setNewRepoUrl] = useState('');

      const addLog = (msg) => {
        setLogs(prev => [...prev, msg]);
      };

      const fetchStatus = useCallback(async () => {
        try {
          const res = await fetch('/api/status');
          const data = await res.json();
          setAiStatus(data);
        } catch (err) {
          addLog(`❌ AI Durumu Alınamadı: ${err.message}`);
        }
      }, []);

      const fetchSkills = useCallback(async () => {
        try {
          const res = await fetch('/api/skills');
          const data = await res.json();
          setLiveSkills(data);
        } catch (err) {
          addLog(`❌ Skill Verisi Alınamadı: ${err.message}`);
        }
      }, []);

      useEffect(() => {
        fetchStatus();
        fetchSkills();
      }, [fetchStatus, fetchSkills]);

      const handleToggleLink = async (aiKey) => {
        const isLinked = aiStatus[aiKey] ? aiStatus[aiKey].linked : false;
        const newState = !isLinked;
        addLog(`⌛ [${aiKey}] bağlantısı değiştiriliyor...`);

        try {
          const res = await fetch('/api/toggle-link', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ai: aiKey, state: newState })
          });
          const data = await res.json();
          addLog(data.message);
          fetchStatus();
        } catch (err) {
          addLog(`❌ Hata: ${err.message}`);
        }
      };

      const handleUpdateSkills = async () => {
        addLog("⌛ Canlı Git Submodule güncellemeleri çekiliyor...");
        try {
          const res = await fetch('/api/update', { method: 'POST' });
          const data = await res.json();
          addLog(data.output);
          fetchStatus();
          fetchSkills();
        } catch (err) {
          addLog(`❌ Güncelleme Hatası: ${err.message}`);
        }
      };

      const handleAddSkill = async (e) => {
        e.preventDefault();
        if (!newRepoUrl.trim()) return alert("Lütfen geçerli bir GitHub URL girin!");
        addLog(`⌛ Yeni repo ekleniyor: ${newRepoUrl}...`);

        try {
          const res = await fetch('/api/add-skill', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: newRepoUrl })
          });
          const data = await res.json();
          addLog(data.output);
          setNewRepoUrl('');
          fetchStatus();
          fetchSkills();
        } catch (err) {
          addLog(`❌ Ekleme Hatası: ${err.message}`);
        }
      };

      return (
        <div class="flex flex-col lg:flex-row min-h-screen">
          <Sidebar
            activeCategory={activeCategory}
            onSelectCategory={setActiveCategory}
            liveSkills={liveSkills}
          />

          <main class="flex-1 p-6 lg:p-10 max-w-5xl">
            <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-8 mb-8 border-b border-slate-800/80">
              <div>
                <h2 class="text-2xl font-extrabold tracking-tight text-white">
                  {activeCategory === 'overview' ? 'React 18 Dashboard & AI Bağlantıları' : liveSkills[activeCategory]?.title}
                </h2>
                <p class="text-xs text-slate-400 mt-1">
                  {activeCategory === 'overview' ? 'React State & Node.js REST API canlı senkronizasyon' : liveSkills[activeCategory]?.subtitle}
                </p>
              </div>

              <div class="flex items-center gap-3">
                <button onClick={() => { fetchStatus(); fetchSkills(); }} class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-all">
                  <span>🔄 Yenile</span>
                </button>
                <span class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  React 18 Engine
                </span>
              </div>
            </header>

            {/* Content View Routing */}
            {activeCategory === 'overview' ? (
              <div>
                <AICardsGrid status={aiStatus} onToggleLink={handleToggleLink} />

                {/* Management Actions */}
                <section class="mb-10">
                  <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">Yönetim İşlemleri</h3>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
                      <div>
                        <h4 class="text-base font-semibold text-white flex items-center gap-2">
                          <span>🔄</span> Canlı Skill Güncelleme
                        </h4>
                        <p class="text-xs text-slate-400 mt-2">
                          Orijinal GitHub repolarından en son sürüm değişikliklerini çeker.
                        </p>
                      </div>
                      <button onClick={handleUpdateSkills} class="mt-6 w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 px-4 rounded-xl transition-all text-sm flex items-center justify-center gap-2">
                        <span>🔄 Tüm Skill'leri Güncelle</span>
                      </button>
                    </div>

                    <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
                      <div>
                        <h4 class="text-base font-semibold text-white flex items-center gap-2">
                          <span>➕</span> Canlı Yeni Skill Reposu Ekle
                        </h4>
                        <p class="text-xs text-slate-400 mt-1">
                          Yeni bir GitHub repo URL'si girin.
                        </p>
                      </div>
                      <form onSubmit={handleAddSkill} class="mt-4 flex flex-col sm:flex-row gap-2">
                        <input
                          type="url"
                          value={newRepoUrl}
                          onChange={(e) => setNewRepoUrl(e.target.value)}
                          placeholder="https://github.com/user/repo.git"
                          class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 font-mono"
                        />
                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-4 rounded-xl text-xs whitespace-nowrap">
                          <span>➕ Ekle</span>
                        </button>
                      </form>
                    </div>
                  </div>
                </section>
              </div>
            ) : (
              <CategoryDetail
                category={liveSkills[activeCategory]}
                onBack={() => setActiveCategory('overview')}
              />
            )}

            {/* Console Log Component */}
            <section class="mt-8">
              <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Canlı React Konsol Logları</h3>
                <button onClick={() => setLogs(["⚡ React konsolu temizlendi."])} class="text-xs text-slate-400 hover:text-slate-200">
                  Temizle
                </button>
              </div>
              <div class="bg-slate-950 border border-slate-800/80 rounded-2xl p-5 font-mono text-xs shadow-2xl overflow-hidden">
                <pre class="text-indigo-300 whitespace-pre-wrap max-h-64 overflow-y-auto leading-relaxed">
                  {logs.join('\n')}
                </pre>
              </div>
            </section>
          </main>
        </div>
      );
    }

    // Render React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
